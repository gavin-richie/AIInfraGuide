[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-infra-answers"
version = "0.1.0"
description = "AIInfraGuide 面试题解答配套代码：Attention 系列手写实现 / Triton kernel / PyTorch 工程实现 / 算法题"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
triton = ["triton>=3.0"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
